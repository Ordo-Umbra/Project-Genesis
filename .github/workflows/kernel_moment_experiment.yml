name: Kernel Moment Extraction

on:
  workflow_dispatch:
    inputs:
      alpha:
        description: "Diffusion coefficient alpha (default: 0.0887 = alpha_target)"
        required: false
        default: "0.0887"
      kappa:
        description: "Capacity kappa for kernel xi (default: 0.4623 = kappa_crit)"
        required: false
        default: "0.4623"
      steps:
        description: "Field evolution steps (default: 100)"
        required: false
        default: "100"
      kernel_C:
        description: "Mexican hat kernel amplitude C in nm^-2 (default: 0.124)"
        required: false
        default: "0.124"
  push:
    paths:
      - "experiments/kernel_moment_extraction.py"
      - "Docs/Kernel_Moments_Derivation.md"
      - "Docs/The_Lucidic_Compass.md"

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib scipy

      - name: Run kernel moment extraction
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python experiments/kernel_moment_extraction.py \
            --alpha ${{ github.event.inputs.alpha || '0.0887' }} \
            --kappa ${{ github.event.inputs.kappa || '0.4623' }} \
            --steps ${{ github.event.inputs.steps || '100' }} \
            --kernel-C ${{ github.event.inputs.kernel_C || '0.124' }} \
            --n-theta 64 \
            --n-z 64 \
            --z-length 20.0 \
            --seed 42 \
            --visualize \
            --output-dir artifacts/kernel_moments

      - name: Display summary
        run: cat artifacts/kernel_moments/summary.txt

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-moment-results
          path: artifacts/kernel_moments/
          retention-days: 30
