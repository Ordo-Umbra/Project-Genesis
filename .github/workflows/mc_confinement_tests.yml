name: MC Confinement Tests

on:
  push:
    branches: ["feature/mc-confinement-tests"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Monte Carlo confinement test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest scipy numpy

      - name: Run confinement tests
        run: |
          pytest tests/test_gauge_mc_confinement.py -v --tb=short

      - name: Run Bessel benchmark only (fast sanity check)
        if: always()
        run: |
          pytest tests/test_gauge_mc_confinement.py::test_bessel_benchmark -v
