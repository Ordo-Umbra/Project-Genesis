name: MC Confinement Tests

on:
  push:
    branches: ["feature/mc-confinement-tests"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Run Monte Carlo confinement test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest numba
          echo "PYTHONPATH=$PYTHONPATH:$(pwd)" >> $GITHUB_ENV

      - name: Verify imports
        run: |
          python -c "from project_genesis.gauge import _dagger, random_unitary, identity_links; print('gauge.py OK')"
          python -c "from project_genesis.gauge_mc import metropolis_sweep, wilson_loop, polyakov_loop, creutz_ratio, fit_area_law, thermalize_and_measure_pure_gauge, deconfinement_scan; print('gauge_mc.py OK')"

      - name: Run structural + gauge-invariance tests (T1-T7)
        run: |
          pytest tests/test_gauge_mc_confinement.py::test_cold_start_flat_connection \
                 tests/test_gauge_mc_confinement.py::test_unitarity_after_sweeps \
                 tests/test_gauge_mc_confinement.py::test_determinant_after_sweeps \
                 tests/test_gauge_mc_confinement.py::test_acceptance_rate_in_range \
                 tests/test_gauge_mc_confinement.py::test_action_decreases_from_hot_start \
                 tests/test_gauge_mc_confinement.py::test_wilson_loop_gauge_invariance \
                 tests/test_gauge_mc_confinement.py::test_wilson_action_gauge_invariance \
                 -v --tb=short

      - name: Run Bessel benchmark T8 (primary sampler correctness)
        run: |
          pytest tests/test_gauge_mc_confinement.py::test_bessel_benchmark -v --tb=short

      - name: Run confinement signature tests (T9-T13)
        run: |
          pytest tests/test_gauge_mc_confinement.py::test_area_suppression \
                 tests/test_gauge_mc_confinement.py::test_rotational_symmetry \
                 tests/test_gauge_mc_confinement.py::test_polyakov_near_zero_confined \
                 tests/test_gauge_mc_confinement.py::test_creutz_ratio_positive \
                 tests/test_gauge_mc_confinement.py::test_area_law_fit_positive_sigma \
                 -v --tb=short
